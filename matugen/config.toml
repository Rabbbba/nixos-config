# Matugen configuration
# Generates ColorTokens.qml (color tokens only) from current wallpaper using Material You 3.
# Non-color tokens (font, anim, …) live statically in quickshell/services/Theme.qml.
# Singleton renamed from Palette to ColorTokens to avoid a name clash with QtQuick/Palette.

[config]

[templates.quickshell-colors]
input_path = "/etc/nixos/matugen/templates/ColorTokens.qml"
output_path = "/etc/nixos/quickshell/services/ColorTokens.qml"
