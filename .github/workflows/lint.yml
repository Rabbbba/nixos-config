name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Tous les jobs utilisent `nix develop --command <tool>` pour ré-utiliser
# exactement les mêmes versions d'outils que le devshell local — pas de
# divergence local-vs-CI.

jobs:
  nix:
    name: Nix (statix + deadnix + nixfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: statix check
        run: nix develop --command statix check .

      # hardware-configuration.nix exclu : auto-généré par nixos-generate-config,
      # ne doit pas être édité à la main (perdu au prochain regen).
      - name: deadnix
        run: nix develop --command deadnix --fail --exclude hardware-configuration.nix .

      - name: nixfmt --check
        run: |
          nix develop --command bash -c '
            files=$(find . -name "*.nix" -not -path "./.git/*")
            nixfmt --check $files
          '

  # Pas de job qmllint : Quickshell utilise des types custom (PanelWindow,
  # Singleton, Variants...) que qmllint ne connaît pas sans importPaths
  # spécifiques, et faire passer les warnings demanderait un fichier de
  # config conséquent pour peu de valeur. Le strict-mode Doxygen + le
  # pre-commit hook + le LSP en édition couvrent la qualité QML.

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: shellcheck
        run: |
          nix develop --command bash -c '
            files=$(find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.git/*")
            if [ -n "$files" ]; then
              shellcheck $files
            else
              echo "No shell scripts found."
            fi
          '

  lua:
    name: Lua (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Formatage Lua check via stylua. Config dans stylua.toml à la racine
      # (tabs, indent 2, column_width 120 — conventions NvChad).
      - name: stylua --check nvim/
        run: nix develop --command stylua --check nvim/
