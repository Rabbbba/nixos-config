name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # manual redeploy without an empty commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    # Runner locale may resolve to ASCII → doxyqml crashes on non-ASCII (e.g. °C).
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen + graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      # same uv as local → same doxyqml + Python
      - uses: astral-sh/setup-uv@v6

      - name: Make wrapper executable
        run: chmod +x quickshell/doxyqml-wrapper.sh

      # Doxyfile has WARN_AS_ERROR=FAIL_ON_WARNINGS → undocumented QML = fail
      - name: Build documentation
        working-directory: quickshell
        run: doxygen Doxyfile

      - name: Upload Pages artifact
        # deploy on push only, not PRs
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: quickshell/doc/html

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
