name: Build

on:
  push:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "configuration.nix"
      - "home.nix"
      - "hardware-configuration.nix"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "configuration.nix"
      - "home.nix"
      - "hardware-configuration.nix"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  nixos:
    name: NixOS toplevel build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub's ubuntu-latest ships ~14 GB free; Nix builds can consume all of
      # it. Strip large unused toolchains/package managers to avoid "No space
      # left on device" during heavy builds.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            || true
          df -h /

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://hyprland.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - uses: cachix/cachix-action@v15
        with:
          name: rabbbba-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix build .#nixosConfigurations.Rayane.config.system.build.toplevel
        run: |
          cachix watch-store rabbbba-nixos &
          WATCH_PID=$!
          trap "kill $WATCH_PID 2>/dev/null || true; wait $WATCH_PID 2>/dev/null || true" EXIT
          nix build \
            --no-link \
            --print-build-logs \
            --accept-flake-config \
            .#nixosConfigurations.Rayane.config.system.build.toplevel
