# ── Terminal and launcher ─────────────────────────────────────────────────────
# Ouvrir terminal
bind=Alt,Return,spawn,ghostty
# Ouvrir lanceur d'applications
bind=Alt,space,spawn,rofi -show drun
# Ouvrir Firefox
bind=SUPER,b,spawn,firefox

# ── Exit ──────────────────────────────────────────────────────────────────────
# Quitter Mango
bind=SUPER+SHIFT,m,quit
# Fermer la fenêtre active
bind=ALT,q,killclient,

# ── Focus ─────────────────────────────────────────────────────────────────────
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
# Cycler le focus dans le tag
bind=SUPER,Tab,focusstack,next

# ── Swap windows ──────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Window states ─────────────────────────────────────────────────────────────
# Basculer flottant/tuilé
bind=ALT,backslash,togglefloating,
# Plein écran
bind=ALT,f,togglefullscreen,
# Faux plein écran (reste dans le layout)
bind=ALT+SHIFT,f,togglefakefullscreen,
# Maximiser sur tout l'écran
bind=ALT,a,togglemaximizescreen,
# Vue d'ensemble de tous les tags
bind=ALT,Tab,toggleoverview,
# Fenêtre visible sur tous les tags
bind=SUPER,g,toggleglobal,
# Minimiser
bind=SUPER,i,minimized,
# Fenêtre toujours au dessus
bind=SUPER,o,toggleoverlay,
# Restaurer la dernière fenêtre minimisée
bind=SUPER+SHIFT,I,restore_minimized
# Afficher/cacher le scratchpad
bind=ALT,z,toggle_scratchpad

# ── Layout ────────────────────────────────────────────────────────────────────
# Cycler entre les layouts
bind=SUPER,n,switch_layout
# Layout tuilé (master + stack)
bind=SUPER,t,setlayout,tile,
# Monocle (une fenêtre à la fois, plein écran)
bind=SUPER,m,setlayout,monocle,
# Grille verticale
bind=SUPER,v,setlayout,vertical_grid,
# Scroller horizontal
bind=SUPER+SHIFT,v,setlayout,vertical_scroller,
# Master prend tout l'espace
bind=ALT,e,set_proportion,1.0
# Cycler les presets de proportion master/stack
bind=ALT,x,switch_proportion_preset,

# ── Tags — navigation ─────────────────────────────────────────────────────────
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
# Tag précédent/suivant en emportant la fenêtre
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
# Déplacer la fenêtre vers tag précédent/suivant
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# ── Tags — accès direct (Ctrl+1-9) ────────────────────────────────────────────
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# ── Tags — déplacer fenêtre vers tag (Alt+1-9) ────────────────────────────────
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# ── Monitor ───────────────────────────────────────────────────────────────────
# Focus moniteur gauche/droit
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
# Envoyer fenêtre sur moniteur gauche/droit
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# ── Gaps ──────────────────────────────────────────────────────────────────────
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ── Move/resize floating windows ──────────────────────────────────────────────
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ── Mouse ─────────────────────────────────────────────────────────────────────
# Super+clic gauche : déplacer | Super+clic droit : redimensionner
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ── Axis (molette + Super) ────────────────────────────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Config reload ─────────────────────────────────────────────────────────────
# Recharge la config mango (rapide)
bind=SUPER,r,reload_config
# Redémarre waybar
bind=SUPER+SHIFT,r,spawn,bash /etc/nixos/mango/scripts/reload.sh



# ── Screenshots ───────────────────────────────────────────────────────────────
# Région vers fichier
bind=SUPER,s,spawn,sh -c 'grim -g "$(slurp)" ~/Screenshots/screen-$(date +%Y%m%d-%H%M%S).png'
# Région vers clipboard + fichier temporaire
bind=SUPER+CTRL,s,spawn,sh -c 'grim -g "$(slurp)" - | tee /tmp/screen.png | wl-copy'

  # ── Volume ────────────────────────────────────────────────────────────────────
  bind=,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
  bind=,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
  bind=,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
  bind=,XF86AudioMicMute,spawn,swayosd-client --input-volume mute-toggle

  # ── Luminosité ────────────────────────────────────────────────────────────────
  bind=,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
  bind=,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

  # ── Media ─────────────────────────────────────────────────────────────────────
  bind=,XF86AudioPlay,spawn,playerctl play-pause
  bind=,XF86AudioPause,spawn,playerctl play-pause
  bind=,XF86AudioNext,spawn,playerctl next
  bind=,XF86AudioPrev,spawn,playerctl previous

#Lock
bind=SUPER,l,spawn,swaylock -fF
