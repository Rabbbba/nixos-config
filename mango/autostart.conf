exec-once=waybar
exec-once=swaync
exec-once=swaybg -o DP-2 -i /etc/nixos/wallpapers/dp2.jpg -m fill
exec-once=swaybg -o DP-1 -i /etc/nixos/wallpapers/dp1.jpg -m fill
exec-once=nm-applet
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store
exec-once=/run/current-system/sw/libexec/xdg-desktop-portal-wlr
exec-once=swayosd-server
exec-once=swayidle -w timeout 300 'swaylock -fF' before-sleep 'swaylock -fF'
