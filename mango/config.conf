# Mango WM config
# https://github.com/mangowm/mango/wiki/

source=~/.config/mango/input.conf
source=~/.config/mango/decoration.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/monitors.conf

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=50
drag_tile_to_tile=1
xwayland_persistence=1
syncobj_enable=0
circle_layout=tile,scroller
single_scratchpad=1

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
rootcolor=0x201b14ff

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack layout
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30
