# Tag layouts
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:vertical_tile,monitor_name:DP-1
tagrule=id:9,layout_name:vertical_tile,monitor_name:DP-1

# Window rules
# Mango uses `isfloating:1` (not `float`). For XWayland windows, appid = WM_CLASS class.
# Steam's WM_CLASS is "steamwebhelper","steam" — class is "steam".
windowrule=isfloating:1,appid:steam
windowrule=isfloating:1,appid:steamwebhelper
windowrule=focused_opacity:0.9,appid:com.mitchellh.ghostty

# Layer rules
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


