# Foot terminal config — Wayland-natif, ultra léger en VRAM (~50-150 MB).
# Doc : man 5 foot.ini ou https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

# ── Apparence ────────────────────────────────────────────────────────────────
font=Iosevka Nerd Font:size=11
dpi-aware=yes
pad=12x12
initial-window-size-chars=120x32

# Theme Gruvbox dark — fichier séparé inclus dans la section [colors]
include=~/.config/foot/gruvbox-dark.conf

# ── Scrollback ───────────────────────────────────────────────────────────────
[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

# ── Cursor ───────────────────────────────────────────────────────────────────
[cursor]
style=beam
blink=yes
blink-rate=500

# ── Souris ───────────────────────────────────────────────────────────────────
[mouse]
hide-when-typing=yes

# ── URLs cliquables ──────────────────────────────────────────────────────────
[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

# ── Bindings clavier ─────────────────────────────────────────────────────────
[key-bindings]
search-start=Control+Shift+f
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u
unicode-input=Control+Shift+i
