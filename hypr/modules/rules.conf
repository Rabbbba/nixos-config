# ── Window rules ──────────────────────────────────────────────────────────────
# Block syntax — Hyprland 0.54+

windowrule {
    name        = pavucontrol-float
    match:class = ^(pavucontrol)$
    float       = yes
}

windowrule {
    name        = blueman-float
    match:class = ^(blueman-manager)$
    float       = yes
}

windowrule {
    name        = nmce-float
    match:class = ^(nm-connection-editor)$
    float       = yes
}

windowrule {
    name        = foot-opacity
    match:class = ^(foot)$
    opacity     = 0.9 0.85
}

windowrule {
    name        = steam-float
    match:class = ^(steam)$
    float       = yes
}
