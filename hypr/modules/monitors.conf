# ── Monitors ──────────────────────────────────────────────────────────────────
# Matched on EDID desc — DP-X names shift across boots.
# Desktop kept SDR: an HDR output can't be captured (portal/grim return black, no
# tonemap). HDR is enabled per-game via gamescope --hdr-enabled in Steam launch opts,
# which scopes it to the game window only. bitdepth 10 keeps SDR gradients banding-free.
monitor = desc:Dell Inc. AW3423DWF 5LKG2S3, 3440x1440@164.9, 1080x0, 1, bitdepth, 10
monitor = desc:AOC 24G1WG4 0x000076A8, 1920x1080@144, 0x0, 1, transform, 3
monitor = , preferred, auto, 1   # fallback

# ── Workspaces per monitor ────────────────────────────────────────────────────
# 1-7 on the OLED (primary), 8-9 on the portrait
workspace = 1, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3, default:true
workspace = 2, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 3, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 4, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 5, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 6, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 7, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 8, monitor:desc:AOC 24G1WG4 0x000076A8, default:true
workspace = 9, monitor:desc:AOC 24G1WG4 0x000076A8
