# ── Monitors ──────────────────────────────────────────────────────────────────
# DP-1 : Dell AW3423DWF QD-OLED 3440x1440 @ 165Hz, bitdepth 10 (HDR-ready)
# DP-2 : AOC 1920x1080 portrait @ 144Hz, à gauche (rotation 1=90°)
monitor = DP-1, 3440x1440@164.9, 1080x0, 1, bitdepth, 10, cm, hdr
monitor = DP-2, 1920x1080@144, 0x0, 1, transform, 3
monitor = , preferred, auto, 1   # fallback pour tout autre écran

# ── Workspaces par moniteur ───────────────────────────────────────────────────
# 1-7 sur DP-1 (principal), 8-9 sur DP-2 (portrait)
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-2, default:true
workspace = 9, monitor:DP-2
