# ── Monitors ──────────────────────────────────────────────────────────────────
# Identifiés par leur description EDID (stable cross-boot, contrairement à DP-X
# qui peut shifter selon l'ordre de détection des outputs).
#
# AW3423DWF : Dell QD-OLED 3440x1440 @ 165Hz, bitdepth 10 (HDR-ready)
# AOC 24G1WG4 : 1920x1080 @ 144Hz, portrait (transform 1 = rotation 90°)
#
# cm = auto : SDR par défaut (économie OLED), HDR auto-switch quand un fullscreen
# HDR-aware le demande via wp-color-management-v1 (cf. render:cm_fs_passthrough = 2)
monitor = desc:Dell Inc. AW3423DWF 5LKG2S3, 3440x1440@164.9, 1080x0, 1, bitdepth, 10, cm, auto, sdrbrightness, 1.5, sdrsaturation, 1.0
monitor = desc:AOC 24G1WG4 0x000076A8, 1920x1080@144, 0x0, 1, transform, 3
monitor = , preferred, auto, 1   # fallback pour tout autre écran

# ── Workspaces par moniteur ───────────────────────────────────────────────────
# 1-7 sur l'OLED (principal), 8-9 sur le portrait
workspace = 1, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3, default:true
workspace = 2, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 3, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 4, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 5, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 6, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 7, monitor:desc:Dell Inc. AW3423DWF 5LKG2S3
workspace = 8, monitor:desc:AOC 24G1WG4 0x000076A8, default:true
workspace = 9, monitor:desc:AOC 24G1WG4 0x000076A8
