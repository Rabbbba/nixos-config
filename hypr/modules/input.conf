# ── Input ─────────────────────────────────────────────────────────────────────
input {
    # fr primary, us secondary. Switching is handled in binds.conf —
    # xkb grp:win_space_toggle doesn't reach games that cache the keymap.
    kb_layout = fr,us
    kb_variant =
    kb_options = caps:backspace
    repeat_rate = 25
    repeat_delay = 600
    numlock_by_default = false
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# 3-finger horizontal swipe → switch workspace
gesture = 3, horizontal, workspace
