# ── Input ─────────────────────────────────────────────────────────────────────
input {
    # AZERTY (fr) primaire, QWERTY (us) secondaire
    # Switch via Super+Space géré directement par xkb (grp:win_space_toggle).
    # Avantage vs hyprctl switchxkblayout : le toggle se fait au niveau driver et
    # est visible immédiatement par tous les clients (Wayland natif, XWayland, jeux
    # en input grab fullscreen) — sans dépendre d'un round-trip via le compositor.
    kb_layout = fr,us
    kb_variant =
    kb_options = grp:win_space_toggle,caps:backspace
    repeat_rate = 25
    repeat_delay = 600
    numlock_by_default = false
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# Touchpad 3-doigts horizontal = switch workspace
gesture = 3, horizontal, workspace
