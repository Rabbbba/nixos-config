# ── Input ─────────────────────────────────────────────────────────────────────
input {
    # AZERTY (fr) primaire, QWERTY (us) secondaire
    # Switch entre les deux via le bind Hyprland Super+Space (cf. binds.conf)
    kb_layout = fr,us
    kb_variant =
    kb_options =
    repeat_rate = 25
    repeat_delay = 600
    numlock_by_default = false
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# Touchpad 3-doigts horizontal = switch workspace
gesture = 3, horizontal, workspace
