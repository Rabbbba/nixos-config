# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = awww-daemon
exec-once = sleep 1 && /etc/nixos/hypr/scripts/wallpaper.sh /etc/nixos/wallpapers/dp2.jpg
exec-once = hypridle
exec-once = dunst
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once = wl-paste --type text --watch cliphist store
exec-once = easyeffects --gapplication-service
exec-once = quickshell -p /etc/nixos/quickshell/shell.qml
# Force DP-2 comme primary X — Steam place ses notif toasts sur le primary
exec-once = xrandr --output DP-2 --primary
# Import env into systemd user manager so user services see WAYLAND_DISPLAY etc.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Start hyprland-session.target — pulls in graphical-session.target (BindsTo)
# which in turn activates elephant + walker (defined in home.nix).
exec-once = systemctl --user start hyprland-session.target
# Daemon qui adapte l'orientation du master layout selon le moniteur
# DP-1 (portrait) → master en haut, DP-2 (paysage) → master à gauche
exec-once = /etc/nixos/hypr/scripts/orientation-daemon.sh
