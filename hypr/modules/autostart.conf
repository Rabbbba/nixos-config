# ── Autostart ─────────────────────────────────────────────────────────────────
# foot --server: one process shared by every footclient — big VRAM win
exec-once = foot --server
exec-once = awww-daemon
exec-once = sleep 1 && /etc/nixos/hypr/scripts/wallpaper.sh /etc/nixos/wallpapers/dp2.jpg
exec-once = hypridle
exec-once = dunst
exec-once = swayosd-server
# CoreCtrl/gparted crash at start without a polkit agent
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = nm-applet --indicator
exec-once = wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once = wl-paste --type text --watch cliphist store
exec-once = easyeffects --gapplication-service
# quickshell runs as a systemd user service (see home.nix) — it needs
# QML_IMPORT_PATH for the NativeSensors plugin, which Hyprland's env lacks.
# Steam pins notification toasts to X primary
exec-once = /etc/nixos/hypr/scripts/xrandr-primary.sh
# expose WAYLAND_DISPLAY etc. to systemd user units
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# triggers graphical-session.target → walker + elephant (home.nix)
exec-once = systemctl --user start hyprland-session.target
# master orientation follows active monitor (portrait → top, landscape → left)
exec-once = /etc/nixos/hypr/scripts/orientation-daemon.sh
