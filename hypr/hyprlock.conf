# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

background {
    monitor = desc:Dell Inc. AW3423DWF 5LKG2S3
    path = /etc/nixos/wallpapers/dp2.jpg
    blur_passes = 3
    blur_size = 8
    contrast = 0.8
    brightness = 0.5
    vibrancy = 0.2
}

background {
    monitor = desc:AOC 24G1WG4 0x000076A8
    path = /etc/nixos/wallpapers/dp1.jpg
    blur_passes = 3
    blur_size = 8
    contrast = 0.8
    brightness = 0.5
    vibrancy = 0.2
}

# input ring on the primary
input-field {
    monitor = desc:Dell Inc. AW3423DWF 5LKG2S3
    size = 360, 60
    position = 0, -100
    halign = center
    valign = center

    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(3c3836)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    check_color = rgb(458588)
    fail_color = rgb(cc241d)
    capslock_color = rgb(d79921)

    fade_on_empty = true
    placeholder_text = <i>Mot de passe…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
}

label {
    monitor = desc:Dell Inc. AW3423DWF 5LKG2S3
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ebdbb2ff)
    font_size = 120
    font_family = Iosevka Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor = desc:Dell Inc. AW3423DWF 5LKG2S3
    text = cmd[update:60000] echo "$(LC_TIME=fr_FR.UTF-8 date +'%A %d %B')"
    color = rgba(ebdbb2cc)
    font_size = 24
    font_family = Iosevka Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor = desc:Dell Inc. AW3423DWF 5LKG2S3
    text = $USER
    color = rgba(ebdbb2cc)
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
