# Hyprland — Rayane
# https://wiki.hyprland.org/Configuring/
# Entry point. Source order matters: vars before binds that use them.

# ── Variables ─────────────────────────────────────────────────────────────────
# Adapt to your stack.
$mod = SUPER
$terminal = footclient
$fileManager = footclient -e yazi
$browser = zen-beta
$menu = walker
$lock = hyprlock

# ── Environment ───────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XKB_DEFAULT_LAYOUT,fr
# amd/mesa: eglDupNativeFenceFDANDROID bug → tearing without this
env = AQ_DRM_NO_EXPLICIT_SYNC,1

# ── Modules ───────────────────────────────────────────────────────────────────
source = ~/.config/hypr/modules/monitors.conf
source = ~/.config/hypr/modules/input.conf
source = ~/.config/hypr/modules/decoration.conf
source = ~/.config/hypr/modules/rules.conf
source = ~/.config/hypr/modules/binds.conf
source = ~/.config/hypr/modules/autostart.conf
