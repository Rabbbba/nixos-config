# Hyprland config — Rayane
# https://wiki.hyprland.org/Configuring/

# ── Monitors ──────────────────────────────────────────────────────────────────
# DP-2 : Dell AW3423DWF QD-OLED 3440x1440 @ 165Hz, bitdepth 10 (HDR-ready)
# DP-1 : AOC 1920x1080 portrait @ 144Hz, à gauche (rotation 1=90°)
monitor = DP-2, 3440x1440@164.9, 1080x0, 1, bitdepth, 10
monitor = DP-1, 1920x1080@144, 0x0, 1, transform, 1
monitor = , preferred, auto, 1   # fallback pour tout autre écran

# ── Workspaces par moniteur ───────────────────────────────────────────────────
# 1-7 sur DP-2 (principal), 8-9 sur DP-1 (portrait)
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-1, default:true
workspace = 9, monitor:DP-1

# ── Variables ─────────────────────────────────────────────────────────────────
$mod = SUPER
$terminal = ghostty
$fileManager = ghostty -e yazi
$browser = firefox
$menu = walker
$lock = hyprlock

# ── Environnement ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XKB_DEFAULT_LAYOUT,fr
# Workaround AMD/Mesa : EGL eglDupNativeFenceFDANDROID bug (fix flicker/tearing)
env = AQ_DRM_NO_EXPLICIT_SYNC,1

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    # AZERTY (fr) primaire, QWERTY (us) secondaire
    # Switch entre les deux avec Super+Space
    kb_layout = fr,us
    kb_variant =
    kb_options = grp:win_space_toggle
    repeat_rate = 25
    repeat_delay = 600
    numlock_by_default = false
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# Touchpad 3-doigts horizontal = switch workspace
gesture = 3, horizontal, workspace

# ── General (layout & gaps) ───────────────────────────────────────────────────
general {
    layout = master
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c9b890ff)
    col.inactive_border = rgba(444444ff)
    resize_on_border = true
    allow_tearing = false
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

# ── Decoration (defaults Hyprland) ────────────────────────────────────────────
decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000088)
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# ── Misc ──────────────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor {
    inactive_timeout = 5
    no_warps = false
    enable_hyprcursor = true
    no_hardware_cursors = 1   # Fix flicker curseur sur AMD
}

# ── Window rules ──────────────────────────────────────────────────────────────
# Syntaxe block (Hyprland 0.54+) — match:* pour matcher, le reste pour appliquer

windowrule {
    name        = pavucontrol-float
    match:class = ^(pavucontrol)$
    float       = yes
}

windowrule {
    name        = blueman-float
    match:class = ^(blueman-manager)$
    float       = yes
}

windowrule {
    name        = nmce-float
    match:class = ^(nm-connection-editor)$
    float       = yes
}

windowrule {
    name        = ghostty-opacity
    match:class = ^(com.mitchellh.ghostty)$
    opacity     = 0.9 0.85
}

windowrule {
    name        = steam-float
    match:class = ^(steam)$
    float       = yes
}

# ── Keybinds ──────────────────────────────────────────────────────────────────

# Apps
bind = $mod, Return, exec, $terminal           # alternative pratique
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, R, exec, $menu
bind = $mod SHIFT, Return, exec, $menu          # alternative pratique
bind = $mod, L, exec, loginctl lock-session     # via systemd → hyprlock auto
bind = $mod SHIFT, T, exec, tidal-hifi

# Wallpaper cycling — change l'image sur DP-2 et régénère le thème via matugen
bind = $mod, W, exec, /etc/nixos/hypr/scripts/wallpaper-cycle.sh next
bind = $mod SHIFT, W, exec, /etc/nixos/hypr/scripts/wallpaper-cycle.sh prev

# Reload config (utile pendant qu'on itère sur la config)
bind = $mod SHIFT, R, exec, hyprctl reload

# Window
bind = $mod, A, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Exit Hyprland
bind = $mod SHIFT, M, exit,

# Focus (vim-keys + arrows)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Swap windows
bind = $mod SHIFT, left, swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up, swapwindow, u
bind = $mod SHIFT, down, swapwindow, d

# Workspaces — AZERTY (sans Shift donne les caractères, pas les chiffres)
# 1 → ampersand (&), 2 → eacute (é), 3 → quotedbl ("),
# 4 → apostrophe ('), 5 → parenleft ((), 6 → minus (-),
# 7 → egrave (è), 8 → underscore (_), 9 → ccedilla (ç)
bind = $mod, ampersand,  workspace, 1
bind = $mod, eacute,     workspace, 2
bind = $mod, quotedbl,   workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft,  workspace, 5
bind = $mod, minus,      workspace, 6
bind = $mod, egrave,     workspace, 7
bind = $mod, underscore, workspace, 8
bind = $mod, ccedilla,   workspace, 9
# Numpad / chiffres directs (utile en QWERTY ou avec keypad)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace — AZERTY
bind = $mod SHIFT, ampersand,  movetoworkspace, 1
bind = $mod SHIFT, eacute,     movetoworkspace, 2
bind = $mod SHIFT, quotedbl,   movetoworkspace, 3
bind = $mod SHIFT, apostrophe, movetoworkspace, 4
bind = $mod SHIFT, parenleft,  movetoworkspace, 5
bind = $mod SHIFT, minus,      movetoworkspace, 6
bind = $mod SHIFT, egrave,     movetoworkspace, 7
bind = $mod SHIFT, underscore, movetoworkspace, 8
bind = $mod SHIFT, ccedilla,   movetoworkspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Cycle workspaces
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse drag/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = $mod, S, exec, sh -c 'grim -g "$(slurp)" ~/Screenshots/screen-$(date +%Y%m%d-%H%M%S).png'
bind = $mod CTRL, S, exec, sh -c 'grim -g "$(slurp)" - | tee /tmp/screen.png | wl-copy'

# Volume (swayosd)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Media
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = awww-daemon
exec-once = sleep 1 && /etc/nixos/hypr/scripts/wallpaper.sh /etc/nixos/wallpapers/dp2.jpg
exec-once = hypridle
exec-once = dunst
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once = wl-paste --type text --watch cliphist store
exec-once = easyeffects --gapplication-service
exec-once = quickshell -p /etc/nixos/quickshell/shell.qml
# Walker (launcher) — daemons backend
exec-once = elephant
exec-once = walker --gapplication-service
# Daemon qui adapte l'orientation du master layout selon le moniteur
# DP-1 (portrait) → master en haut, DP-2 (paysage) → master à gauche
exec-once = /etc/nixos/hypr/scripts/orientation-daemon.sh
