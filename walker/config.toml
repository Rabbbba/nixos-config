# Walker — application launcher
# https://github.com/abenz1267/walker

app_launch_prefix = ""
terminal_title_flag = ""
locale = "fr_FR"
close_when_open = true
theme = "default"
monitor = ""

[keys]
accept_typeahead = ["tab"]
trigger_labels = "lalt"
next = ["down"]
prev = ["up"]
close = ["esc"]
remove_from_history = ["shift backspace"]
resume_query = ["ctrl r"]
toggle_exact_search = ["ctrl e"]

[search]
delay = 0
hide_icons = false
margin_spinner = 10
placeholder = "Rechercher…"

[list]
height = 300
margin_top = 0
always_show = false
hide_sub = false
single_click = true
visibility_threshold = 0.6

[builtins.applications]
weight = 5
name = "applications"
placeholder = "Applications"
prioritize_new = true
hide_actions_with_empty_query = true
context_aware = true
refresh = false
show_sub_when_single = true
actions = true
cache = true
hide_without_query = false

[builtins.calc]
weight = 5
name = "calc"
icon = "accessories-calculator"
min_chars = 4
require_number = true

[builtins.runner]
weight = 5
name = "runner"
icon = "utilities-terminal"
prefix = "!"
include_in_default = true
generic_entry = false
history = true
shell_config = ""

[builtins.clipboard]
weight = 5
name = "clipboard"
icon = "edit-paste"
prefix = ":"
max_entries = 10
exec = "wl-copy"
